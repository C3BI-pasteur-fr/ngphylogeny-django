x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: "${NGPHYLO_SETTINGS_MODULE:-NGPhylogeny_fr.settings.local}"
  NGPHYLO_DATABASE_ENGINE: django.db.backends.postgresql
  NGPHYLO_DATABASE_NAME: ngphylo
  NGPHYLO_DATABASE_USER: ngphylo
  NGPHYLO_DATABASE_PASSWORD: ngphylo_local_dev
  NGPHYLO_DATABASE_HOST: db
  NGPHYLO_DATABASE_PORT: "5432"
  NGPHYLO_REDIS_URL: redis://redis:6379/0
  # Point these at a running Galaxy server (e.g. the docker-compose in the
  # sibling NGPhylogeny_fr_galaxytools repo) to link it up automatically -
  # see README.md. Left unset, the app still starts, it just has no Galaxy
  # server to submit workflows to yet.
  NGPHYLO_GALAXY_URL: "${NGPHYLO_GALAXY_URL:-}"
  NGPHYLO_GALAXY_KEY: "${NGPHYLO_GALAXY_KEY:-}"
  NGPHYLO_ADMIN_USER: "${NGPHYLO_ADMIN_USER:-admin}"
  NGPHYLO_ADMIN_EMAIL: "${NGPHYLO_ADMIN_EMAIL:-admin@example.org}"
  NGPHYLO_ADMIN_PASSWORD: "${NGPHYLO_ADMIN_PASSWORD:-password}"
  # SMTP config for job-completion emails and the daily workflow report
  # (workspace.tasks.send_daily_report, 8am UTC - see CLAUDE.md). Left
  # unset, sending just fails/no-ops (send_daily_report specifically
  # no-ops without NGPHYLO_REPORT_RECIPIENTS - it doesn't need working SMTP
  # config to still be safe to leave enabled).
  NGPHYLO_EMAIL_HOST: "${NGPHYLO_EMAIL_HOST:-}"
  NGPHYLO_EMAIL_PORT: "${NGPHYLO_EMAIL_PORT:-}"
  NGPHYLO_EMAIL_HOST_USER: "${NGPHYLO_EMAIL_HOST_USER:-}"
  NGPHYLO_EMAIL_HOST_PASSWORD: "${NGPHYLO_EMAIL_HOST_PASSWORD:-}"
  NGPHYLO_EMAIL_USE_TLS: "${NGPHYLO_EMAIL_USE_TLS:-False}"
  # Comma-separated recipient list for the daily workflow report.
  NGPHYLO_REPORT_RECIPIENTS: "${NGPHYLO_REPORT_RECIPIENTS:-}"
  NGPHYLO_REPORT_FROM_EMAIL: "${NGPHYLO_REPORT_FROM_EMAIL:-ngphylogeny@pasteur.fr}"
  # "True" serves templates/maintenance.html (503) for every request
  # instead of routing normally - see NGPhylogeny_fr/middleware.py.
  NGPHYLO_MAINTENANCE_MODE: "${NGPHYLO_MAINTENANCE_MODE:-False}"
  # "True" activates the Pasteur Galaxy BLAST server option and
  # deactivates NCBI's public one at the same time (mutually exclusive,
  # not independently toggleable) - see settings/base.py's BLASTS dict.
  # Note BLAST analysis is currently disabled regardless
  # (blast/views.py's BlastView.dispatch()) - this alone won't bring it
  # back.
  NGPHYLO_PASTEUR_BLAST_ENABLED: "${NGPHYLO_PASTEUR_BLAST_ENABLED:-False}"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ngphylo
      POSTGRES_PASSWORD: ngphylo_local_dev
      POSTGRES_DB: ngphylo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngphylo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ngphylo-db:/var/lib/postgresql/data

  redis:
    image: redis:7

  # One-shot: migrations, admin user, and (if NGPHYLO_GALAXY_URL/KEY are set)
  # Galaxy server linking + tool/workflow import. web/celery-* wait for this
  # to finish before starting.
  init:
    build: .
    command: ["docker/init.sh"]
    environment: *django-env
    # collectstatic (run by docker/init.sh) writes to STATIC_ROOT
    # (/home/ngphylo/static) inside *this* container's own filesystem -
    # without this shared volume, those files never reach web (a
    # separate container from the same image, but its own independent
    # filesystem), so under DEBUG=False (settings.prod - see
    # settings/base.py's STATICFILES_STORAGE/whitenoise setup) every
    # static asset 404s. Only bit under DEBUG=True (settings.local, the
    # default here), where Django's dev server serves static files
    # directly and never needs STATIC_ROOT populated at all - easy to
    # not notice locally.
    volumes:
      - ngphylo-static:/home/ngphylo/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: .
    ports:
      - "8000:8000"
    environment: *django-env
    volumes:
      - ngphylo-static:/home/ngphylo/static
    depends_on:
      init:
        condition: service_completed_successfully

  celery-worker:
    build: .
    command: ["celery", "-A", "NGPhylogeny_fr.celery:app", "worker", "-l", "INFO", "-Q", "default,monitor,ncbi_blast"]
    environment: *django-env
    depends_on:
      init:
        condition: service_completed_successfully

  celery-beat:
    build: .
    command: ["celery", "-A", "NGPhylogeny_fr.celery:app", "beat", "-l", "INFO"]
    environment: *django-env
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  ngphylo-db:
  ngphylo-static:
