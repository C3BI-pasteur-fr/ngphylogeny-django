---
apiVersion: v1
kind: Service
metadata:
  name: ngphylogeny-web
  labels:
    app: ${NAMESPACE}
    role: web
spec:
  selector:
    app: ${NAMESPACE}
    role: web
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ngphylogeny-web
  labels:
    app: ${NAMESPACE}
    role: web
  annotations:
    kubernetes.io/ingress.class: "${INGRESS_CLASS}"
    # Uploaded alignment files can be sizeable - don't let nginx's
    # default body-size cap silently reject them (matches drmab-web,
    # which handles arbitrarily large FASTQ uploads for the same
    # reason).
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  rules:
    - host: ${PUBLIC_URL}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ngphylogeny-web
                port:
                  number: 80
