---
apiVersion: v1
kind: Secret
metadata:
  name: ngphylogeny-credentials
type: Opaque
stringData:
  # Every value here comes from a masked/protected GitLab CI/CD variable
  # (scoped to this job's Environment), substituted by envsubst at deploy
  # time - none of it is committed to git. See .gitlab-ci.yml's `.deploy`
  # comment for the full list of variables a real deploy needs set.
  #
  # secret-key: Django's SECRET_KEY - generate a real one with
  #   `python -c "import secrets; print(secrets.token_urlsafe(48))"`.
  secret-key: "${DJANGO_SECRET_KEY}"
  # admin-password: the Django admin/superuser account init creates.
  admin-password: "${ADMIN_PASSWORD}"
  # galaxy-key: an API key for the Pasteur Galaxy server
  # (galaxy.pasteur.fr, or whichever instance NGPHYLO_GALAXY_URL below
  # points at) that this app authenticates to Galaxy with - NOT a k8s
  # secret drmab-web itself bothered to protect (it passed the
  # equivalent GALAXYKEY as a plain envsubst'd value), but there's no
  # reason not to do better here.
  galaxy-key: "${GALAXY_KEY}"
  # email-host-password: SMTP password for job-completion emails and the
  # daily report (see CLAUDE.md) - leave the CI/CD variable unset (empty)
  # if email isn't needed yet, sending just fails/no-ops either way.
  email-host-password: "${EMAIL_HOST_PASSWORD}"
---
apiVersion: batch/v1
kind: Job
metadata:
  # Fixed name, not one templated per commit/run: kept simple to delete-
  # and-recreate on every deploy (Jobs are immutable once created, so a
  # bare `kubectl apply` on an existing completed Job errors) - see
  # .gitlab-ci.yml's `kubectl delete job ... --ignore-not-found` before
  # this is applied, same idiom as drmab-web's registry-gitlab secret.
  name: ngphylogeny-init
spec:
  # Auto-cleaned after an hour so completed Jobs don't pile up across
  # every redeploy - kubectl delete above also gets rid of the previous
  # one immediately regardless.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ${NAMESPACE}
        role: init
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-gitlab
      containers:
        - name: init
          image: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
          # Runs docker/init.sh as-is (migrations, admin user, tool_flags
          # fixture, and - since NGPHYLO_GALAXY_URL/KEY are set below -
          # linking the Galaxy server and importing its tools/workflows).
          # No changes needed there for Kubernetes: it's already the
          # same one-shot "run once before web/celery start" step
          # docker-compose.yml's own `init` service uses, just run here
          # as a Job instead of a compose service.
          command: ["docker/init.sh"]
          env:
            # Optional - only this Job needs it (docker/init.sh's own
            # NGPHYLO_GALAXY_WORKFLOW_IDS check, see CLAUDE.md's
            # "Kubernetes deployment" section). Left unset, importworkflows
            # falls back to its previous name-based listing behavior -
            # not set on web/celery-worker/celery-beat below since only
            # the init step ever runs importworkflows.
            - name: NGPHYLO_GALAXY_WORKFLOW_IDS
              value: "${GALAXY_WORKFLOW_IDS}"
            - name: DJANGO_SETTINGS_MODULE
              # Explicit on every single container below, not left to
              # manage.py's own default (settings.local, DEBUG=True) -
              # see CLAUDE.md's "NGPHYLO_SETTINGS_MODULE vs
              # DJANGO_SETTINGS_MODULE" section for exactly how easy it
              # is to silently end up running production under dev
              # settings by getting this one variable name wrong.
              value: "NGPhylogeny_fr.settings.prod"
            - name: NGPHYLO_DATABASE_ENGINE
              value: "django.db.backends.postgresql"
            - name: NGPHYLO_DATABASE_HOST
              value: "postgres"
            - name: NGPHYLO_DATABASE_PORT
              value: "5432"
            - name: NGPHYLO_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: NGPHYLO_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: NGPHYLO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: NGPHYLO_REDIS_URL
              value: "redis://redis:6379/0"
            # The Pasteur Galaxy server - external to this cluster, not
            # something this deployment runs (see CLAUDE.md's "upgrade
            # vs the old master branch" / the bioblend x-api-key notes
            # for what this app expects from whatever Galaxy it points
            # at).
            - name: NGPHYLO_GALAXY_URL
              value: "${GALAXY_URL}"
            - name: NGPHYLO_GALAXY_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: galaxy-key
            - name: NGPHYLO_ADMIN_USER
              value: "${ADMIN_USER}"
            - name: NGPHYLO_ADMIN_EMAIL
              value: "${ADMIN_EMAIL}"
            - name: NGPHYLO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: admin-password
            - name: NGPHYLO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: secret-key
            # Tells Django it's behind a TLS-terminating Ingress for this
            # specific hostname - makes login/CSRF/session cookies work
            # correctly (see settings/prod.py). Must match the Ingress
            # host below.
            - name: NGPHYLO_HTTPS_HOST
              value: "${PUBLIC_URL}"
            - name: NGPHYLO_EMAIL_HOST
              value: "${EMAIL_HOST}"
            - name: NGPHYLO_EMAIL_PORT
              value: "${EMAIL_PORT}"
            - name: NGPHYLO_EMAIL_HOST_USER
              value: "${EMAIL_HOST_USER}"
            - name: NGPHYLO_EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: email-host-password
            - name: NGPHYLO_EMAIL_USE_TLS
              value: "${EMAIL_USE_TLS}"
            - name: NGPHYLO_REPORT_RECIPIENTS
              value: "${REPORT_RECIPIENTS}"
            - name: NGPHYLO_REPORT_FROM_EMAIL
              value: "${REPORT_FROM_EMAIL}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngphylogeny-web
spec:
  selector:
    matchLabels:
      app: ${NAMESPACE}
      role: web
  replicas: 1
  template:
    metadata:
      labels:
        app: ${NAMESPACE}
        role: web
    spec:
      imagePullSecrets:
        - name: registry-gitlab
      containers:
        - name: web
          image: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
          imagePullPolicy: Always
          # uwsgi (already a dependency - see requirement.txt), not
          # `manage.py runserver` (Django's dev server, what
          # docker-compose.yml uses for local/IFB-Cloud-VM deployment) -
          # this is the one place across every existing deployment of
          # this app that's actually meant to take real traffic behind a
          # load balancer, so it gets a real WSGI server. Static files
          # are already baked into the image (see Dockerfile's
          # collectstatic step) and served by whitenoise regardless of
          # which of these fronts it.
          command: ["uwsgi"]
          args:
            - "--http"
            - ":8000"
            - "--module"
            - "NGPhylogeny_fr.wsgi"
            - "--master"
            - "--processes"
            - "4"
            - "--threads"
            - "2"
            - "--harakiri"
            - "120"
          ports:
            - containerPort: 8000
          env:
            # Only web needs this - celery-worker/celery-beat don't serve
            # HTTP at all, and the init Job should keep running
            # migrations/setup regardless (see
            # NGPhylogeny_fr/middleware.py). Left unset/empty (the
            # default when the MAINTENANCE CI/CD variable isn't set),
            # maintenance mode stays off.
            - name: NGPHYLO_MAINTENANCE_MODE
              value: "${MAINTENANCE}"
            - name: DJANGO_SETTINGS_MODULE
              # Explicit on every single container below, not left to
              # manage.py's own default (settings.local, DEBUG=True) -
              # see CLAUDE.md's "NGPHYLO_SETTINGS_MODULE vs
              # DJANGO_SETTINGS_MODULE" section for exactly how easy it
              # is to silently end up running production under dev
              # settings by getting this one variable name wrong.
              value: "NGPhylogeny_fr.settings.prod"
            - name: NGPHYLO_DATABASE_ENGINE
              value: "django.db.backends.postgresql"
            - name: NGPHYLO_DATABASE_HOST
              value: "postgres"
            - name: NGPHYLO_DATABASE_PORT
              value: "5432"
            - name: NGPHYLO_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: NGPHYLO_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: NGPHYLO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: NGPHYLO_REDIS_URL
              value: "redis://redis:6379/0"
            # The Pasteur Galaxy server - external to this cluster, not
            # something this deployment runs (see CLAUDE.md's "upgrade
            # vs the old master branch" / the bioblend x-api-key notes
            # for what this app expects from whatever Galaxy it points
            # at).
            - name: NGPHYLO_GALAXY_URL
              value: "${GALAXY_URL}"
            - name: NGPHYLO_GALAXY_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: galaxy-key
            - name: NGPHYLO_ADMIN_USER
              value: "${ADMIN_USER}"
            - name: NGPHYLO_ADMIN_EMAIL
              value: "${ADMIN_EMAIL}"
            - name: NGPHYLO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: admin-password
            - name: NGPHYLO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: secret-key
            # Tells Django it's behind a TLS-terminating Ingress for this
            # specific hostname - makes login/CSRF/session cookies work
            # correctly (see settings/prod.py). Must match the Ingress
            # host below.
            - name: NGPHYLO_HTTPS_HOST
              value: "${PUBLIC_URL}"
            - name: NGPHYLO_EMAIL_HOST
              value: "${EMAIL_HOST}"
            - name: NGPHYLO_EMAIL_PORT
              value: "${EMAIL_PORT}"
            - name: NGPHYLO_EMAIL_HOST_USER
              value: "${EMAIL_HOST_USER}"
            - name: NGPHYLO_EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: email-host-password
            - name: NGPHYLO_EMAIL_USE_TLS
              value: "${EMAIL_USE_TLS}"
            - name: NGPHYLO_REPORT_RECIPIENTS
              value: "${REPORT_RECIPIENTS}"
            - name: NGPHYLO_REPORT_FROM_EMAIL
              value: "${REPORT_FROM_EMAIL}"
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1Gi"
          readinessProbe:
            httpGet:
              # /status, not / - a plain static 200, exempted from
              # MaintenanceModeMiddleware (see that file's docstring).
              # Probing / meant enabling maintenance mode made the
              # probes read the deliberate 503 as "container broken" and
              # endlessly restart it via failed liveness checks, taking
              # the site fully down instead of showing the maintenance
              # page - the opposite of the intended effect.
              path: /status
              port: 8000
            # Generous initial delay: a cold uwsgi worker's first request
            # (Django app loading, first DB connection) measured ~1-2s
            # locally but can run longer under load/slower storage -
            # matches drmab-web's own choice of a non-trivial delay here
            # rather than assuming instant readiness.
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngphylogeny-celery-worker
spec:
  selector:
    matchLabels:
      app: ${NAMESPACE}
      role: celery-worker
  # celery-beat (below) is a singleton by design - don't scale that one -
  # but this one can go beyond 1 replica later if job-monitoring/BLAST
  # throughput needs it; matches CELERY_TASK_ROUTES' default/monitor/
  # ncbi_blast queues, all handled by the same worker process here, same
  # as docker-compose.yml.
  replicas: 1
  template:
    metadata:
      labels:
        app: ${NAMESPACE}
        role: celery-worker
    spec:
      imagePullSecrets:
        - name: registry-gitlab
      containers:
        - name: celery-worker
          image: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
          imagePullPolicy: Always
          command: ["celery"]
          # --concurrency is explicit, not left to celery's own default
          # (billiard.cpu_count(), i.e. the node's total visible CPU
          # count with no CPU `limits:` set below to give it a cgroup
          # quota to detect instead) - on a shared node that can fork far
          # more worker processes than intended, each duplicating the
          # full Django+biopython+matplotlib process image, which OOMKilled
          # this container almost immediately on startup, before any real
          # task ever ran. This worker's actual job is polling Galaxy for
          # status and sending email, not heavy local compute (the real
          # tool execution happens on Galaxy), so a small fixed pool is
          # plenty.
          args: ["-A", "NGPhylogeny_fr.celery:app", "worker", "-l", "INFO",
                  "-Q", "default,monitor,ncbi_blast", "--concurrency=2"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              # Explicit on every single container below, not left to
              # manage.py's own default (settings.local, DEBUG=True) -
              # see CLAUDE.md's "NGPHYLO_SETTINGS_MODULE vs
              # DJANGO_SETTINGS_MODULE" section for exactly how easy it
              # is to silently end up running production under dev
              # settings by getting this one variable name wrong.
              value: "NGPhylogeny_fr.settings.prod"
            - name: NGPHYLO_DATABASE_ENGINE
              value: "django.db.backends.postgresql"
            - name: NGPHYLO_DATABASE_HOST
              value: "postgres"
            - name: NGPHYLO_DATABASE_PORT
              value: "5432"
            - name: NGPHYLO_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: NGPHYLO_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: NGPHYLO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: NGPHYLO_REDIS_URL
              value: "redis://redis:6379/0"
            # The Pasteur Galaxy server - external to this cluster, not
            # something this deployment runs (see CLAUDE.md's "upgrade
            # vs the old master branch" / the bioblend x-api-key notes
            # for what this app expects from whatever Galaxy it points
            # at).
            - name: NGPHYLO_GALAXY_URL
              value: "${GALAXY_URL}"
            - name: NGPHYLO_GALAXY_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: galaxy-key
            - name: NGPHYLO_ADMIN_USER
              value: "${ADMIN_USER}"
            - name: NGPHYLO_ADMIN_EMAIL
              value: "${ADMIN_EMAIL}"
            - name: NGPHYLO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: admin-password
            - name: NGPHYLO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: secret-key
            # Tells Django it's behind a TLS-terminating Ingress for this
            # specific hostname - makes login/CSRF/session cookies work
            # correctly (see settings/prod.py). Must match the Ingress
            # host below.
            - name: NGPHYLO_HTTPS_HOST
              value: "${PUBLIC_URL}"
            - name: NGPHYLO_EMAIL_HOST
              value: "${EMAIL_HOST}"
            - name: NGPHYLO_EMAIL_PORT
              value: "${EMAIL_PORT}"
            - name: NGPHYLO_EMAIL_HOST_USER
              value: "${EMAIL_HOST_USER}"
            - name: NGPHYLO_EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: email-host-password
            - name: NGPHYLO_EMAIL_USE_TLS
              value: "${EMAIL_USE_TLS}"
            - name: NGPHYLO_REPORT_RECIPIENTS
              value: "${REPORT_RECIPIENTS}"
            - name: NGPHYLO_REPORT_FROM_EMAIL
              value: "${REPORT_FROM_EMAIL}"
          resources:
            requests:
              memory: "384Mi"
            limits:
              memory: "1536Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngphylogeny-celery-beat
spec:
  selector:
    matchLabels:
      app: ${NAMESPACE}
      role: celery-beat
  # Must stay 1: celery-beat is a scheduler, not a work queue consumer -
  # running more than one replica fires every periodic task (see
  # CELERY_BEAT_SCHEDULE in settings/base.py: old-history cleanup, the
  # daily report, BLAST monitoring, ...) multiple times over.
  replicas: 1
  template:
    metadata:
      labels:
        app: ${NAMESPACE}
        role: celery-beat
    spec:
      imagePullSecrets:
        - name: registry-gitlab
      containers:
        - name: celery-beat
          image: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
          imagePullPolicy: Always
          command: ["celery"]
          args: ["-A", "NGPhylogeny_fr.celery:app", "beat", "-l", "INFO"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              # Explicit on every single container below, not left to
              # manage.py's own default (settings.local, DEBUG=True) -
              # see CLAUDE.md's "NGPHYLO_SETTINGS_MODULE vs
              # DJANGO_SETTINGS_MODULE" section for exactly how easy it
              # is to silently end up running production under dev
              # settings by getting this one variable name wrong.
              value: "NGPhylogeny_fr.settings.prod"
            - name: NGPHYLO_DATABASE_ENGINE
              value: "django.db.backends.postgresql"
            - name: NGPHYLO_DATABASE_HOST
              value: "postgres"
            - name: NGPHYLO_DATABASE_PORT
              value: "5432"
            - name: NGPHYLO_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: NGPHYLO_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: NGPHYLO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: NGPHYLO_REDIS_URL
              value: "redis://redis:6379/0"
            # The Pasteur Galaxy server - external to this cluster, not
            # something this deployment runs (see CLAUDE.md's "upgrade
            # vs the old master branch" / the bioblend x-api-key notes
            # for what this app expects from whatever Galaxy it points
            # at).
            - name: NGPHYLO_GALAXY_URL
              value: "${GALAXY_URL}"
            - name: NGPHYLO_GALAXY_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: galaxy-key
            - name: NGPHYLO_ADMIN_USER
              value: "${ADMIN_USER}"
            - name: NGPHYLO_ADMIN_EMAIL
              value: "${ADMIN_EMAIL}"
            - name: NGPHYLO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: admin-password
            - name: NGPHYLO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: secret-key
            # Tells Django it's behind a TLS-terminating Ingress for this
            # specific hostname - makes login/CSRF/session cookies work
            # correctly (see settings/prod.py). Must match the Ingress
            # host below.
            - name: NGPHYLO_HTTPS_HOST
              value: "${PUBLIC_URL}"
            - name: NGPHYLO_EMAIL_HOST
              value: "${EMAIL_HOST}"
            - name: NGPHYLO_EMAIL_PORT
              value: "${EMAIL_PORT}"
            - name: NGPHYLO_EMAIL_HOST_USER
              value: "${EMAIL_HOST_USER}"
            - name: NGPHYLO_EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngphylogeny-credentials
                  key: email-host-password
            - name: NGPHYLO_EMAIL_USE_TLS
              value: "${EMAIL_USE_TLS}"
            - name: NGPHYLO_REPORT_RECIPIENTS
              value: "${REPORT_RECIPIENTS}"
