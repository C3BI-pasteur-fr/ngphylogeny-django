{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    {% block meta %} {% endblock %}

    <meta http-equiv="Content-type" content="text/html;charset=UTF-8"/>
    <title>NGPhylogeny.fr{% block title-block %}{% endblock %}</title>
    <script src="{% static 'js/jquery-2.1.4.min.js' %}"></script>
    <script src="{% static 'js/ngphylo.js' %}"></script>

    <!-- Bootstrap -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <!-- Bootstrap Material Design -->
    <link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/home.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/custom.css' %}"/>
</head>
<body>
  <div class="github-fork-ribbon">
    <a href="https://github.com/C3BI-pasteur-fr/NGPhylogeny_fr_django">Fork me on GitHub</a>
  </div>
<div id="page-wrapper">
  <header class="pagehead">
    <h1><span class="title-cap">NG</span>Phylogeny.fr</h1>
  </header>
    <div style="margin-left:auto;margin-right:auto;text-align: center;font-size:15pt;">
      NGPhylogeny.fr is currently under maintenance.<br/><br/>

      We'll be back shortly. Thank you for your patience.<br/>
      
      <img src="{% static 'images/maintenance.png' %}"/>
    </div>

  <footer class="footer container-fluid">
        <div class="row">
            <a href="https://www.pasteur.fr">
                <div><img class="center-block logo_contrib" alt="Institut Pasteur"
                          src="{% static 'images/logo_institut_pasteur.png' %}"></div>
            </a>
            <a href="http://www.lirmm.fr">
                <div><img class="center-block logo_contrib" alt="Lirmm"
                          src="{% static 'images/logo_lirmm.png' %}"></div>
            </a>
            <a href="http://www.atgc-montpellier.fr">
                <div><img class="center-block logo_contrib" alt="LRI"
                          src="{% static 'images/logo_atgc.png' %}"></div>
            </a>
            <a href="https://www.lri.fr/">
                <div><img class="center-block logo_contrib" alt="LRI"
                          src="{% static 'images/logo_lri.png' %}"></div>
            </a>

            <a href="https://www.france-bioinformatique.fr">
                <div><img class="center-block logo_contrib" alt="IFB"
                          src="{% static 'images/logo_ifb.png' %}"></div>
            </a>
        </div>

</footer>
</div>
</body>
</html>
