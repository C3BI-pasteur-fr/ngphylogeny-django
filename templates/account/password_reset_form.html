{% extends "base.html" %}
{% block content %}
    <div class="row">
        <div class="col-md-2"></div>
        <div class="col-md-8">
            <h2>Forgot your password?</h2>
            <p class="text-muted">
                Enter the email address on your account and we'll send you a
                link to reset your password.
            </p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="submit" class="btn btn-default" value="Send reset link"/>
            </form>
        </div>
    </div>
{% endblock %}
