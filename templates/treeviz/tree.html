{% extends "display.html" %}
{% load static %}
{% block stylesheet %}
    <!-- Modern, actively-maintained phylotree.js (npm "phylotree" 2.6.0 -
         the same "veg/phylotree.js" project the old presto/phylotree.js
         bundle here used to be, just years newer: D3 v7 core, TypeScript,
         real releases) instead of the old PRESTO toolbar built by hand
         against that ancient version's API. The toolbar below is a fresh,
         small one built directly against the new API's own real
         accessors (radial()/alignTips()/internalNames(), all verified
         directly against the vendored bundle, not guessed from docs) -
         plus the library's own built-in interaction/context-menu system
         (click a node) for everything not covered by an explicit
         button. Needs underscore AND lodash loaded as separate globals
         first - see underscore-lodash-shim.js for why both, in that
         order, are required (a real bug in this package's own UMD
         build, not a choice made here). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js"></script>
    <script>window.__phylotreeUnderscore = window._;</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="{% static 'phylotree-2.6.0/underscore-lodash-shim.js' %}"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'phylotree-2.6.0/phylotree.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'phylotree-2.6.0/phylotree-menus.css' %}"/>
    <script src="{% static 'phylotree-2.6.0/phylotree.js' %}"></script>
    <style>
      .tree-viewer-wrapper {
        padding: 10px 0;
      }
      .tree-viewer-hint {
        color: #666;
        margin-bottom: 10px;
      }
      .tree-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
        padding: 10px 14px;
        margin-bottom: 12px;
        background: #f7f7f9;
        border: 1px solid #e3e3e3;
        border-radius: 4px;
      }
      .tree-toolbar .toolbar-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tree-toolbar label {
        font-weight: normal;
        margin: 0;
        white-space: nowrap;
      }
      #tree_container {
        width: 100%;
        overflow: auto;
      }
      #tree_container svg {
        max-width: none;
      }
      .branch-length-label {
        font-size: 9px;
        fill: #888;
      }
    </style>
{% endblock %}
{% block content %}
    <div class="tree-viewer-wrapper">
        <h3>Phylogenetic tree viewer</h3>
        <p class="tree-viewer-hint">
            Click a node for more options (collapse/expand, hide, reroot
            here). Scroll to zoom, drag to pan.
        </p>
        <div class="tree-toolbar">
            <div class="toolbar-group">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-default btn-sm active" id="layout_linear">Linear</button>
                    <button type="button" class="btn btn-default btn-sm" id="layout_circular" title="Radial layout, rooted at the center">Circular</button>
                    <button type="button" class="btn btn-default btn-sm" id="layout_unrooted" title="Equal-angle unrooted layout (sometimes itself also called &quot;radial&quot;)">Unrooted</button>
                </div>
            </div>
            <div class="toolbar-group">
                <label><input type="checkbox" id="toggle_align_tips"> Align tips</label>
            </div>
            <div class="toolbar-group">
                <label><input type="checkbox" id="toggle_support_values"> Show support values</label>
            </div>
            <div class="toolbar-group">
                <label><input type="checkbox" id="toggle_branch_lengths"> Show branch lengths</label>
            </div>
            <div class="toolbar-group">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-default btn-sm" id="zoom_out" title="Zoom out">
                        <span class="glyphicon glyphicon-zoom-out"></span>
                    </button>
                    <button type="button" class="btn btn-default btn-sm" id="zoom_in" title="Zoom in">
                        <span class="glyphicon glyphicon-zoom-in"></span>
                    </button>
                    <button type="button" class="btn btn-default btn-sm" id="zoom_reset" title="Reset view">
                        <span class="glyphicon glyphicon-refresh"></span>
                    </button>
                </div>
            </div>
            <div class="toolbar-group">
                <span>Tip font size</span>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-default btn-sm" id="font_size_decrease" title="Smaller tip labels">
                        <span class="glyphicon glyphicon-minus"></span>
                    </button>
                    <button type="button" class="btn btn-default btn-sm" id="font_size_increase" title="Larger tip labels">
                        <span class="glyphicon glyphicon-plus"></span>
                    </button>
                </div>
            </div>
            <div class="toolbar-group">
                <button type="button" class="btn btn-default btn-sm" id="copy_tip_names" title="Copy the selected clade's tip names to the clipboard">
                    Copy selected tip names
                </button>
            </div>
            <div class="toolbar-group">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-default btn-sm" id="export_svg" title="Export the tree as an SVG image">Export SVG</button>
                    <button type="button" class="btn btn-default btn-sm" id="export_png" title="Export the tree as a PNG image">Export PNG</button>
                </div>
            </div>
        </div>
        <div id="tree_container"></div>
    </div>
    <script>
        // A negative branch length (e.g. a small numerical-correction
        // artifact some phylogenetic methods leave near true zero, like
        // "Tant_cDNA:-0.00007") is not physically meaningful in any
        // layout, but confirmed live to actively break the unrooted
        // (equal-angle) layout specifically - a real reported bug, not a
        // cosmetic one: that one branch rendered ~800 SVG units long
        // (its sister taxon's equivalent, non-negative branch rendered
        // at ~2 units) - reproduced directly against the real tree via
        // this exact newick. Traced to phylotree.js's own
        // branch_length_accessor clamping a negative length to exactly
        // 0 - and it's the *zero*, not the negative sign itself, that
        // breaks the equal-angle direction-vector math (degenerates to
        // a zero-length vector, confirmed by testing a small *positive*
        // epsilon in place of 0, which did not fix it, before landing on
        // this). Simply stripping the minus sign (keeping the original
        // magnitude, not clamping to 0 or forcing an arbitrary epsilon)
        // is the fix verified to work - applied here rather than left
        // for phylotree.js's own clamping, since that only kicks in
        // after the layout math has already broken.
        var newick = "{{ newick_tree|escapejs }}".replace(/:-(?=[\d.])/g, ':');

        // Toolbar state - each control just flips one of these and calls
        // rebuildTree()/applyBranchLengthLabels(), rather than trying to
        // patch the existing render in place for every option; render()
        // itself is cheap (this is a single tree, not a huge alignment),
        // and re-rendering from scratch is the same pattern the library
        // uses internally for its own reroot handling (verified directly
        // in the vendored bundle, not assumed) - simpler and more
        // reliable than tracking exactly which options can be changed
        // live vs which need a fresh render.
        var treeOptions = {
            container: "#tree_container",
            width: 1200,
            height: 800,
            "show-scale": true,
            selectable: true,
            collapsible: true,
            reroot: true,
            hide: true,
            // Deliberately false, unlike the library's own default: brush
            // (click-and-drag to rubber-band-select a region) and zoom
            // (click-and-drag to pan) both bind to the same plain-drag
            // gesture, and having both enabled at once is genuinely
            // confusing in practice - a drag can't tell which one you
            // meant, and once a brush selection starts it doesn't offer
            // any obvious way to back out of it. With brush off, a drag
            // is unambiguously "pan" and a plain click is unambiguously
            // "select/open this node's menu".
            brush: false,
            zoom: true,
            "align-tips": false,
            // Three mutually-exclusive layouts: plain left-to-right
            // ("linear", both false), a radial layout rooted at the
            // center ("is-radial"), and a genuinely different equal-angle
            // unrooted layout ("is-unrooted" - confirmed directly against
            // the vendored bundle to produce real, distinct node
            // positions from is-radial, not an alias for it - the two
            // are easy to conflate since "unrooted" layouts are
            // themselves sometimes informally called "radial" too).
            // Never set both true at once - see setLayout() below.
            "is-radial": false,
            "is-unrooted": false,
            "internal-names": false
        };
        var showBranchLengths = false;
        var display;

        // Draws (or, when showBranchLengths is false, clears) a small text
        // label with the branch length at each edge's midpoint. There's no
        // built-in boolean for this in phylotree.js 2.x (verified directly
        // against the vendored bundle - "bootstrap"/"internal-names" cover
        // support values, nothing covers branch-length text; there IS a
        // built-in hover tooltip showing "Length = ..." on every edge
        // already, found while tracing this - this label is in addition to
        // that, not a replacement), so this is a small custom style_edges
        // callback instead - the one piece of this toolbar that isn't just
        // flipping a documented option. `style_edges` binds `this` to the
        // TreeRender instance for whatever callback it's given (verified
        // directly in the vendored bundle), so `this.phylotree.
        // branch_length_accessor(...)` - the library's own accessor,
        // matching how it computes the hover tooltip's own value - is used
        // here rather than reading the parsed newick's raw "attribute"
        // field by hand. This toolbar's own branch-length toggle calls
        // rebuildTree()'s display.layout() (see the toggle handler
        // below), never display.refresh() - a real bug in this library
        // version's refresh() (an arrow function loses `this` partway
        // through its own edge-styling call, breaking element.selectAll()
        // with "this.querySelectorAll is not a function") means refresh()
        // can't be used to apply this without hitting that bug.
        //
        // But refresh() isn't only called from code this toolbar
        // controls - modifySelection() (the library's own selection
        // mechanism, used internally by the built-in node menu's "All
        // terminal nodes"/"Incident branch"/"Path to root"/etc. actions)
        // calls refresh() itself too, found live: selecting a clade via
        // the menu threw this exact exception, breaking selection
        // entirely, regardless of whether the branch-length toggle was
        // ever touched - since style_edges' callback runs on every edge
        // unconditionally, this toggle's mere presence was enough to
        // break the unrelated built-in selection feature. Guarded
        // defensively instead of trying to avoid every internal
        // refresh() call site (there's no guarantee this is the only
        // one, or that a future phylotree.js version doesn't add more):
        // if `element` isn't wrapping a real DOM node (i.e. this is that
        // broken refresh() code path calling in with the TreeRender
        // instance itself instead), just no-op rather than throw.
        // element.selectAll() alone can't tell the two apart - select()
        // always returns a full Selection object with every method
        // present regardless of what it's wrapping, and only throws
        // *inside* selectAll() once it tries to actually use the
        // wrapped non-DOM object - confirmed live, a first attempt at
        // this guard checked `typeof element.selectAll` and still threw.
        function branchLengthStyler(element, edgeDatum) {
            var node = element && element.node && element.node();
            if (!node || typeof node.querySelectorAll !== 'function') {
                return;
            }
            element.selectAll(".branch-length-label").remove();
            var length = this.phylotree.branch_length_accessor(edgeDatum.target);
            if (showBranchLengths && length !== undefined) {
                element.append("text")
                    .attr("class", "branch-length-label")
                    .attr("x", (edgeDatum.source.y + edgeDatum.target.y) / 2)
                    .attr("y", (edgeDatum.source.x + edgeDatum.target.x) / 2 - 3)
                    .text(parseFloat(length).toFixed(3));
            }
        }

        // Tip label font size, in px, as requested via the render()
        // "font-size" option - but that option alone isn't enough to
        // make an *increase* visible: verified directly against the
        // vendored bundle that the actually-rendered size
        // (this.shown_font_size) is computed as
        // Math.min(this.font_size, this.scales[0]), and under this
        // library's default spacing mode ("fixed-step"),
        // this.scales[0] is just this.fixed_width[0] - hardcoded to 14
        // in the constructor, completely independent of the "font-size"
        // option. Confirmed empirically: rendering with "font-size": 24
        // alone still measured a computed font-size of 14px - the
        // library's own live `spacing_x()` accessor (which does map onto
        // fixed_width[0]) is what actually has to move too, followed by
        // a real .layout() call (its own built-in call to
        // this.placenodes() alone wasn't enough to recompute
        // shown_font_size - only a full .layout() pass does). Also
        // worth knowing: the library's *own* font_size() accessor method
        // is unreachable for this - `this.font_size` is set as a plain
        // instance property in the constructor, which shadows the
        // same-named prototype method entirely, so `display.font_size(20)`
        // throws "not a function" - confirmed directly, not guessed.
        var tipFontSize = 14;

        function applyTipFontSize() {
            treeOptions["font-size"] = tipFontSize;
            rebuildTree();
            if (display.spacing_x() < tipFontSize) {
                display.spacing_x(tipFontSize, true);
                display.layout();
            }
        }

        function rebuildTree() {
            var tree = new window.phylotree.phylotree(newick);
            display = tree.render(treeOptions);
            display.style_edges(branchLengthStyler);
            var container = document.getElementById("tree_container");
            container.innerHTML = "";
            container.appendChild(display.show());
        }

        rebuildTree();

        $("#font_size_increase").on("click", function () {
            tipFontSize = Math.min(tipFontSize + 2, 40);
            applyTipFontSize();
        });
        $("#font_size_decrease").on("click", function () {
            tipFontSize = Math.max(tipFontSize - 2, 6);
            applyTipFontSize();
        });

        function setLayout($button, isRadial, isUnrooted) {
            treeOptions["is-radial"] = isRadial;
            treeOptions["is-unrooted"] = isUnrooted;
            $("#layout_linear, #layout_circular, #layout_unrooted").removeClass("active");
            $button.addClass("active");
            rebuildTree();
        }
        $("#layout_linear").on("click", function () {
            setLayout($(this), false, false);
        });
        $("#layout_circular").on("click", function () {
            setLayout($(this), true, false);
        });
        $("#layout_unrooted").on("click", function () {
            setLayout($(this), false, true);
        });
        $("#toggle_align_tips").on("change", function () {
            treeOptions["align-tips"] = this.checked;
            rebuildTree();
        });
        $("#toggle_support_values").on("change", function () {
            treeOptions["internal-names"] = this.checked;
            rebuildTree();
        });
        $("#toggle_branch_lengths").on("change", function () {
            showBranchLengths = this.checked;
            // Not display.refresh() - see branchLengthStyler's own
            // comment for the real bug in this library version that
            // rules it out here.
            display.layout();
        });
        $("#zoom_in").on("click", function () {
            display.zoomBehavior.scaleBy(display.svg, 1.3);
        });
        $("#zoom_out").on("click", function () {
            display.zoomBehavior.scaleBy(display.svg, 1 / 1.3);
        });
        $("#zoom_reset").on("click", function () {
            rebuildTree();
        });

        // Selection is the library's own built-in mechanism (a click on
        // a node opens its menu - "All terminal nodes", "Incident
        // branch", "Path to root", etc. under "Toggle Selection" all
        // call display.modifySelection(...) internally, verified
        // directly in the vendored bundle) - this just reads back
        // whatever's currently selected via display.getSelection() and
        // expands any selected *internal* node to its own leaf
        // descendants, so "select a clade, then copy its tip names"
        // works the same whether the user selected the clade's root or
        // its individual tips one by one.
        function getSelectedTipNames() {
            var selected = display.getSelection();
            var names = [];
            selected.forEach(function (node) {
                if (display.phylotree.isLeafNode(node)) {
                    names.push(node.data.name);
                } else {
                    display.phylotree.selectAllDescendants(node, true, false)
                        .forEach(function (leaf) { names.push(leaf.data.name); });
                }
            });
            return names.filter(function (name, i) { return names.indexOf(name) === i; });
        }

        function copyViaExecCommand(text) {
            // Fallback for browsers without the Clipboard API, or where
            // it exists but rejects (e.g. no document focus/user-gesture
            // credit at the moment of the call) - a temporary off-screen
            // textarea + the old execCommand, same approach
            // workspace/histories' own permalink copy button already
            // uses in this codebase.
            var $textarea = $('<textarea readonly></textarea>')
                .css({position: 'fixed', top: '-1000px', left: '-1000px'})
                .val(text);
            $('body').append($textarea);
            $textarea[0].select();
            document.execCommand('copy');
            $textarea.remove();
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).catch(function () {
                    copyViaExecCommand(text);
                });
            }
            copyViaExecCommand(text);
            return $.Deferred().resolve().promise();
        }

        function flashButtonText($button, text) {
            var original = $button.data('original-text');
            if (original === undefined) {
                original = $button.text();
                $button.data('original-text', original);
            }
            $button.text(text);
            clearTimeout($button.data('flash-timer'));
            $button.data('flash-timer', setTimeout(function () {
                $button.text($button.data('original-text'));
            }, 1500));
        }

        $("#copy_tip_names").on("click", function () {
            var $button = $(this);
            var names = getSelectedTipNames();
            if (names.length === 0) {
                flashButtonText($button, 'Nothing selected');
                return;
            }
            copyTextToClipboard(names.join('\n')).then(function () {
                flashButtonText($button, 'Copied ' + names.length + ' name' + (names.length === 1 ? '' : 's') + '!');
            });
        });

        // SVG/PNG export. The exported file needs the tree's own CSS
        // embedded directly in it (phylotree.css's rules, e.g. node
        // circle colors, only apply here via this page's <link> tag -
        // a serialized SVG fragment doesn't carry an external
        // stylesheet with it, so without this every export would come
        // out as unstyled black-on-white shapes) - fetched once and
        // cached rather than hand-copied into this file, so it can
        // never drift out of sync with the real, currently-vendored
        // phylotree.css.
        var exportCssCache = null;
        function getExportCss(callback) {
            if (exportCssCache !== null) {
                callback(exportCssCache);
                return;
            }
            $.get("{% static 'phylotree-2.6.0/phylotree.css' %}", function (css) {
                exportCssCache = css;
                callback(css);
            }).fail(function () {
                exportCssCache = '';
                callback('');
            });
        }

        function buildExportableSvg(css) {
            var clone = display.svg.node().cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('width', treeOptions.width);
            clone.setAttribute('height', treeOptions.height);
            if (!clone.getAttribute('viewBox')) {
                clone.setAttribute('viewBox', '0 0 ' + treeOptions.width + ' ' + treeOptions.height);
            }
            var styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            styleEl.textContent = css;
            clone.insertBefore(styleEl, clone.firstChild);
            return clone;
        }

        function downloadBlob(blob, filename) {
            var url = URL.createObjectURL(blob);
            var $link = $('<a></a>').attr({href: url, download: filename}).appendTo('body');
            $link[0].click();
            $link.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }

        $("#export_svg").on("click", function () {
            getExportCss(function (css) {
                var svgString = new XMLSerializer().serializeToString(buildExportableSvg(css));
                downloadBlob(new Blob([svgString], {type: 'image/svg+xml'}), 'tree.svg');
            });
        });

        $("#export_png").on("click", function () {
            getExportCss(function (css) {
                var svgString = new XMLSerializer().serializeToString(buildExportableSvg(css));
                // A base64 data: URI, not a blob: URL, for the <img> source
                // that gets drawn onto the canvas below - a blob: URL is
                // known to leave the canvas "tainted" (blocking
                // canvas.toBlob) in some browsers even for same-document,
                // same-origin SVG content; a data: URI doesn't have that
                // problem. unescape(encodeURIComponent(...)) is the
                // standard way to base64-encode a real UTF-8 string
                // (btoa alone only handles Latin1).
                var dataUrl = 'data:image/svg+xml;base64,' +
                    btoa(unescape(encodeURIComponent(svgString)));
                var img = new Image();
                img.onload = function () {
                    var scale = 2; // a plain 1:1 raster looks noticeably soft
                    var canvas = document.createElement('canvas');
                    canvas.width = treeOptions.width * scale;
                    canvas.height = treeOptions.height * scale;
                    var ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff'; // the SVG itself has no background
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.scale(scale, scale);
                    ctx.drawImage(img, 0, 0, treeOptions.width, treeOptions.height);
                    canvas.toBlob(function (blob) {
                        downloadBlob(blob, 'tree.png');
                    }, 'image/png');
                };
                img.src = dataUrl;
            });
        });
    </script>
{% endblock %}
